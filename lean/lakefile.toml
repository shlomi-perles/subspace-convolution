name = "SubspaceConvolution"
version = "1.0.0"
keywords = ["math", "subspace lattice", "zeta transform", "Grassmannian", "graph coloring", "rank-width"]
description = "Lean 4 verification of the paper A Fast Algorithm for Subspace Convolution"
defaultTargets = ["SubspaceConvolution"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "dd67281f3bb9c5f3fe04baf036790ebc4da52314"

[[lean_lib]]
name = "SubspaceConvolution"
